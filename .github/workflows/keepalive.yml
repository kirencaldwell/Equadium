# Pings the Render API so the free instance doesn't spin down (Render sleeps after 15 minutes idle).
# Runs every 14 minutes, 8:00-20:00 America/Los_Angeles. GitHub cron is UTC-only, so it fires across a wider
# UTC window (14:00-04:59 UTC covers 8am-8pm in both PST and PDT) and the job skips itself outside local hours.
#
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables -> add RENDER_URL
# (e.g. https://equadium-api.onrender.com, no trailing path).
name: keep-alive

on:
  schedule:
    - cron: "*/14 14-23 * * *"
    - cron: "*/14 0-4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping server (8am-8pm Pacific only)
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          hour=$(TZ=America/Los_Angeles date +%-H)
          if [ "$FORCE" != "true" ] && { [ "$hour" -lt 8 ] || [ "$hour" -ge 20 ]; }; then
            echo "Pacific hour is $hour, outside 8-20; skipping."
            exit 0
          fi
          if [ -z "$RENDER_URL" ]; then
            echo "::error::Repository variable RENDER_URL is not set."
            exit 1
          fi
          # A cold start can take ~1 minute, so allow generous retries.
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 "${RENDER_URL%/}/health"
